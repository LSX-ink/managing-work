<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSX HQ · Command Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #04060d; --cyan: #33e1ff; --mag: #ff3dbb; --vio: #8b5cf6; --gold: #ffcf4a; --green: #3dffa2; --red: #ff4d6d;
  --panel: rgba(10, 16, 34, .72); --edge: rgba(51, 225, 255, .28); --text: #dbe7ff; --muted: #7d8db3; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 14px/1.4 Rajdhani, system-ui, sans-serif; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 120%, rgba(139,92,246,.18), transparent 60%); }
#scene { position: fixed; inset: 0; z-index: 0; }
.hud { position: fixed; inset: 0; z-index: 2; display: grid; grid-template-columns: 330px 1fr 350px; grid-template-rows: 70px 1fr 170px; gap: 12px; padding: 12px; pointer-events: none; }
.hud > * { pointer-events: auto; }
header { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 18px;
  background: linear-gradient(180deg, rgba(10,16,34,.9), rgba(10,16,34,.55)); border: 1px solid var(--edge); clip-path: polygon(0 0, 100% 0, 98.5% 100%, 1.5% 100%); }
.h-left { display: flex; gap: 14px; align-items: center; }
.sigil { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, var(--gold) 35%, #b45309 70%); box-shadow: 0 0 22px var(--gold); animation: throb 2.4s infinite; }
@keyframes throb { 50% { box-shadow: 0 0 40px var(--gold), 0 0 80px rgba(255,207,74,.4); } }
.title { font: 900 22px/1 Orbitron, sans-serif; letter-spacing: .32em; background: linear-gradient(90deg, #fff, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(51,225,255,.35); }
.sub { font: 600 11px Orbitron; letter-spacing: .3em; color: var(--muted); }
.divs { display: flex; gap: 8px; justify-content: center; }
.chip { font: 700 11px Orbitron; letter-spacing: .16em; padding: 6px 12px; border: 1px solid var(--cyan); color: var(--cyan); background: rgba(51,225,255,.08); box-shadow: inset 0 0 12px rgba(51,225,255,.2); }
.chip.add { border-style: dashed; color: var(--muted); border-color: var(--muted); background: none; box-shadow: none; }
.h-right { display: flex; gap: 16px; justify-content: flex-end; align-items: center; }
.health { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; max-width: 520px; font: 600 11px JetBrains Mono; color: var(--muted); }
.health span { display: inline-flex; align-items: center; gap: 5px; }
.led { width: 7px; height: 7px; border-radius: 50%; background: #445; } .led.ok { background: var(--green); box-shadow: 0 0 8px var(--green); } .led.bad { background: var(--red); box-shadow: 0 0 10px var(--red); animation: blink .7s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.clock { font: 900 26px Orbitron; color: #fff; text-shadow: 0 0 18px var(--cyan); }
.col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.panel { background: var(--panel); border: 1px solid var(--edge); backdrop-filter: blur(8px); position: relative; display: flex; flex-direction: column; min-height: 0;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
.panel::before { content: ""; position: absolute; left: 0; top: 0; width: 40%; height: 2px; background: linear-gradient(90deg, var(--c, var(--cyan)), transparent); }
.panel h2 { margin: 0; padding: 10px 14px 8px; font: 700 11px Orbitron; letter-spacing: .24em; color: var(--c, var(--cyan)); display: flex; justify-content: space-between; align-items: center; }
.panel h2 i { font-style: normal; color: var(--muted); font-size: 10px; }
.pb { padding: 2px 14px 12px; overflow: auto; min-height: 0; }
.pb::-webkit-scrollbar { width: 4px; } .pb::-webkit-scrollbar-thumb { background: var(--edge); }
.grow { flex: 1; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kpi { border: 1px solid rgba(51,225,255,.18); padding: 8px; background: rgba(51,225,255,.04); }
.kpi b { display: block; font: 700 22px Orbitron; color: #fff; text-shadow: 0 0 12px var(--c, var(--cyan)); }
.kpi span { font: 600 10px Orbitron; letter-spacing: .12em; color: var(--muted); }
.agent { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(51,225,255,.08); cursor: pointer; }
.agent:hover { background: rgba(51,225,255,.05); }
.agent .em { font-size: 18px; text-align: center; filter: drop-shadow(0 0 6px var(--c)); }
.agent b { font: 700 13px Orbitron; letter-spacing: .08em; color: var(--c); } .agent small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.st { font: 700 10px Orbitron; letter-spacing: .12em; padding: 3px 7px; border: 1px solid currentColor; }
.st.working { color: var(--green); animation: blink 1.1s infinite; box-shadow: 0 0 10px rgba(61,255,162,.4); } .st.idle { color: var(--muted); } .st.error { color: var(--red); } .st.paused { color: var(--gold); }
.orders { white-space: pre-wrap; font: 600 14px/1.5 Rajdhani; }
.stream .ev { font: 12px/1.45 "JetBrains Mono", monospace; padding: 5px 0 5px 10px; border-left: 2px solid var(--c, #334); margin-bottom: 4px; white-space: pre-wrap; animation: in .35s ease; }
.stream .ev b { color: var(--c); } .stream .ev time { color: var(--muted); margin-right: 6px; }
.stream .ev.win { background: linear-gradient(90deg, rgba(61,255,162,.07), transparent); } .stream .ev.error { background: linear-gradient(90deg, rgba(255,77,109,.1), transparent); } .stream .ev.warn { background: linear-gradient(90deg, rgba(255,207,74,.07), transparent); }
@keyframes in { from { opacity: 0; transform: translateX(8px); } }
.bottom { grid-column: 1 / -1; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; min-height: 0; }
.pipe { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-items: end; height: 100%; }
.stage { text-align: center; } .bar { margin: 0 auto 6px; width: 70%; background: linear-gradient(180deg, var(--c), transparent); box-shadow: 0 0 16px var(--c); min-height: 4px; transition: height .8s; }
.stage b { font: 700 18px Orbitron; color: #fff; display: block; } .stage span { font: 600 10px Orbitron; letter-spacing: .1em; color: var(--muted); }
.meter { height: 10px; border: 1px solid var(--edge); margin: 10px 0 6px; } .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--vio), var(--mag)); box-shadow: 0 0 14px var(--mag); transition: width .8s; }
.need { border-left: 2px solid var(--mag); padding: 4px 8px; margin-bottom: 6px; background: rgba(255,61,187,.06); font-size: 13px; }
.set { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; color: var(--muted); font-size: 13px; }
.set input, .set select { width: 120px; background: rgba(4,6,13,.8); color: var(--text); border: 1px solid var(--edge); padding: 4px 6px; font: 600 13px Rajdhani; }
button { font: 700 11px Orbitron; letter-spacing: .14em; color: #04060d; background: linear-gradient(90deg, var(--cyan), #7af0ff); border: 0; padding: 9px 14px; cursor: pointer; box-shadow: 0 0 18px rgba(51,225,255,.45); clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
button.ghost { background: transparent; color: var(--cyan); border: 1px solid var(--cyan); box-shadow: none; }
#labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.lab { position: absolute; transform: translate(-50%, -100%); text-align: center; pointer-events: auto; cursor: pointer; }
.lab b { display: block; font: 700 12px Orbitron; letter-spacing: .14em; color: var(--c); text-shadow: 0 0 10px var(--c); }
.lab span { font: 600 11px Rajdhani; color: #c6d4f5; background: rgba(4,6,13,.65); padding: 1px 6px; border: 1px solid rgba(255,255,255,.08); }
.lab .say { display: block; max-width: 220px; margin-top: 4px; font: 600 12px Rajdhani; color: #fff; background: rgba(10,16,34,.85); border: 1px solid var(--c); padding: 4px 8px; box-shadow: 0 0 14px var(--c); animation: in .3s ease; }
.core-lab { position: absolute; transform: translate(-50%, 0); font: 900 13px Orbitron; letter-spacing: .4em; color: var(--gold); text-shadow: 0 0 14px var(--gold); text-align: center; }
.core-lab small { display: block; font: 600 10px Orbitron; letter-spacing: .2em; color: var(--muted); }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; place-items: center; z-index: 9; }
.sheet.open { display: grid; }
.card { width: min(560px, 92vw); max-height: 84vh; overflow: auto; background: rgba(10,16,34,.96); border: 1px solid var(--c); box-shadow: 0 0 40px -6px var(--c); padding: 20px; }
.card h3 { margin: 0; font: 700 18px Orbitron; color: var(--c); letter-spacing: .12em; } .card p { color: var(--muted); }
.row { display: flex; gap: 10px; margin: 12px 0; }
@media (max-width: 1300px) { .hud { grid-template-columns: 290px 1fr 300px; } .bottom { grid-template-columns: 1fr 1fr; } .bottom > :last-child { display: none; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<div class="hud">
  <header>
    <div class="h-left"><div class="sigil"></div><div><div class="title">LSX HQ</div><div class="sub">COMMAND BRIDGE · AGENCY OPS</div></div></div>
    <div class="divs" id="divs"></div>
    <div class="h-right"><div class="health" id="health"></div><div class="clock" id="clock">--:--</div></div>
  </header>

  <div class="col">
    <section class="panel" style="--c:var(--gold)"><h2>TODAY'S ORDERS <i>ATLAS · CEO</i></h2><div class="pb orders" id="orders" style="max-height:230px">Atlas sets the orders at 07:55.</div></section>
    <section class="panel grow"><h2>ACTIVE AGENTS <i id="activeN"></i></h2><div class="pb" id="agents"></div></section>
  </div>
  <div></div>
  <div class="col">
    <section class="panel"><h2>AI OVERVIEW <i>LIVE</i></h2><div class="pb"><div class="kpis" id="kpis"></div></div></section>
    <section class="panel grow stream" style="--c:var(--mag)"><h2>AUTOMATION STREAM <i id="streamN"></i></h2><div class="pb" id="stream"></div></section>
  </div>

  <div class="bottom">
    <section class="panel" style="--c:var(--green)"><h2>PIPELINE <i>KINETIC WEB DESIGNS</i></h2><div class="pb" style="height:120px"><div class="pipe" id="pipe"></div></div></section>
    <section class="panel" style="--c:var(--vio)"><h2>VERA · OUTBOX <i>QUALITY CONTROL</i></h2><div class="pb"><div id="outbox"></div><div class="meter"><i id="meter" style="width:0"></i></div><div id="numbers" style="color:var(--muted);font-size:12.5px;max-height:52px;overflow:auto"></div></div></section>
    <section class="panel" style="--c:var(--mag)"><h2>NEEDS YOU · ORDERS <i id="needN"></i></h2><div class="pb">
      <div id="needs"></div>
      <div class="set">Trade of the week <input id="trade"></div>
      <div class="set">DM drafts / day <input id="perday" type="number" min="0" max="40"></div>
      <button id="save" style="width:100%">TRANSMIT ORDERS</button>
    </div></section>
  </div>
</div>
<div class="sheet" id="sheet"><div class="card" id="card"></div></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let agents = [], lastId = 0, colours = { hq: "#ffcf4a" }, names = { hq: "HQ" }, memories = 0, ready = false;
const bubbles = {};

/* ------------------------------------------------------------------ the 3D office
   A neural brain core in the middle (a glowing icosahedron inside a shell of linked particles), and one floating
   glass platform per agent in a ring around it: each has desks, screens and low-poly people. A working platform
   lights up, its people bob and type, and pulses of light run along its beam to the core. */
const host = $("#scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; host.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x04060d, 0.018);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 34, 52);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 4); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
controls.minDistance = 22; controls.maxDistance = 90; controls.maxPolarAngle = Math.PI * 0.46;
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.05, 0.55, 0.12); composer.addPass(bloom);

scene.add(new THREE.AmbientLight(0x4466aa, 0.55));
const key = new THREE.DirectionalLight(0x99bbff, 0.9); key.position.set(10, 30, 15); scene.add(key);
const coreLight = new THREE.PointLight(0xffcf4a, 60, 40, 1.6); coreLight.position.set(0, 4, 0); scene.add(coreLight);

// floor grid
const grid = new THREE.GridHelper(220, 110, 0x163a5a, 0x0c1a2e); grid.position.y = -2.2; grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);
const ringGeo = new THREE.RingGeometry(9.5, 9.7, 96); const ringMat = new THREE.MeshBasicMaterial({ color: 0x33e1ff, transparent: true, opacity: .35, side: THREE.DoubleSide });
for (const r of [1, 1.9, 2.8]) { const ring = new THREE.Mesh(ringGeo, ringMat.clone()); ring.scale.setScalar(r); ring.rotation.x = -Math.PI / 2; ring.position.y = -2.1; ring.material.opacity = .25 / r; scene.add(ring); }

// the brain core
const core = new THREE.Group(); scene.add(core); core.position.y = 4;
const coreMat = new THREE.MeshStandardMaterial({ color: 0xffcf4a, emissive: 0xffa31a, emissiveIntensity: 2.2, roughness: .3, metalness: .2 });
const coreMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2, 2), coreMat); core.add(coreMesh);
const wire = new THREE.Mesh(new THREE.IcosahedronGeometry(3.4, 1), new THREE.MeshBasicMaterial({ color: 0x33e1ff, wireframe: true, transparent: true, opacity: .35 })); core.add(wire);
const N = 900, pts = new Float32Array(N * 3), seeds = [];
for (let i = 0; i < N; i++) { const r = 4.6 + Math.random() * 3.6, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
  pts.set([r * Math.sin(p) * Math.cos(t), r * Math.cos(p) * .8, r * Math.sin(p) * Math.sin(t)], i * 3); seeds.push(Math.random() * 6); }
const cloudGeo = new THREE.BufferGeometry(); cloudGeo.setAttribute("position", new THREE.BufferAttribute(pts, 3));
const cloud = new THREE.Points(cloudGeo, new THREE.PointsMaterial({ color: 0x9fdcff, size: .11, transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false })); core.add(cloud);
// neural links between nearby particles
const linkPos = [];
for (let i = 0; i < N; i += 3) for (let j = i + 3; j < Math.min(N, i + 60); j += 3) {
  const dx = pts[i*3]-pts[j*3], dy = pts[i*3+1]-pts[j*3+1], dz = pts[i*3+2]-pts[j*3+2]; if (dx*dx+dy*dy+dz*dz < 2.2) linkPos.push(pts[i*3],pts[i*3+1],pts[i*3+2],pts[j*3],pts[j*3+1],pts[j*3+2]); }
const linkGeo = new THREE.BufferGeometry(); linkGeo.setAttribute("position", new THREE.Float32BufferAttribute(linkPos, 3));
core.add(new THREE.LineSegments(linkGeo, new THREE.LineBasicMaterial({ color: 0xff3dbb, transparent: true, opacity: .22, blending: THREE.AdditiveBlending })));

// agent platforms
const pods = {};
const R = 17.5;
function person(col) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.32, .7, 4, 10), new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: .25, roughness: .6 }));
  body.position.y = .75; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.28, 16, 12), new THREE.MeshStandardMaterial({ color: 0xf1d4b8, roughness: .7 })); head.position.y = 1.55; g.add(head);
  g.userData.body = body; return g;
}
function makePod(a, i, n) {
  const col = new THREE.Color(a.colour), ang = i / n * Math.PI * 2 - Math.PI / 2;
  const g = new THREE.Group(); g.position.set(Math.cos(ang) * R, 0, Math.sin(ang) * R); g.lookAt(0, 0, 0); scene.add(g);
  const base = new THREE.Mesh(new THREE.BoxGeometry(9, .5, 7), new THREE.MeshStandardMaterial({ color: 0x0b1428, metalness: .6, roughness: .25, transparent: true, opacity: .92 }));
  g.add(base);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(base.geometry), new THREE.LineBasicMaterial({ color: col })); g.add(edges);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(9, 7), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: .14, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  glow.rotation.x = -Math.PI / 2; glow.position.y = .27; g.add(glow);
  // glass back wall
  const wall = new THREE.Mesh(new THREE.BoxGeometry(9, 3.2, .1), new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: .15, transparent: true, opacity: .16 }));
  wall.position.set(0, 1.85, -3.45); g.add(wall);
  const screens = [], people = [];
  for (let k = 0; k < 3; k++) {
    const x = -2.8 + k * 2.8;
    const desk = new THREE.Mesh(new THREE.BoxGeometry(2.1, .12, 1), new THREE.MeshStandardMaterial({ color: 0x1b2742, metalness: .4, roughness: .4 })); desk.position.set(x, 1.1, -1.1); g.add(desk);
    const leg = new THREE.Mesh(new THREE.BoxGeometry(.12, .85, .7), desk.material); leg.position.set(x, .67, -1.1); g.add(leg);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.5, .85), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: .5 }));
    scr.position.set(x, 1.75, -1.5); g.add(scr); screens.push(scr);
    const p = person(col); p.position.set(x, .25, -.1); p.rotation.y = Math.PI; g.add(p); people.push(p);
  }
  // beam to the core
  const from = g.position.clone().setY(1.5), to = new THREE.Vector3(0, 4, 0);
  const mid = from.clone().lerp(to, .5).add(new THREE.Vector3(0, 6, 0));
  const curve = new THREE.QuadraticBezierCurve3(from, mid, to);
  const beam = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, .05, 6, false), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: .2, blending: THREE.AdditiveBlending }));
  scene.add(beam);
  const pulses = Array.from({ length: 4 }, (_, k) => { const m = new THREE.Mesh(new THREE.SphereGeometry(.18, 10, 8), new THREE.MeshBasicMaterial({ color: col })); m.userData.t = k / 4; m.visible = false; scene.add(m); return m; });
  const light = new THREE.PointLight(col, 0, 14, 1.8); light.position.set(0, 3, 0); g.add(light);
  pods[a.key] = { g, glow, screens, people, beam, curve, pulses, light, wall, col, burst: 0 };
}

const v = new THREE.Vector3();
function labels() {
  let html = "";
  const cpos = new THREE.Vector3(0, 9.5, 0).project(camera);
  html += `<div class="core-lab" style="left:${(cpos.x + 1) / 2 * innerWidth}px;top:${(1 - cpos.y) / 2 * innerHeight}px">THE BRAIN<small>${memories} MEMORIES · NEURAL CORE</small></div>`;
  agents.forEach(a => { const p = pods[a.key]; if (!p) return;
    v.copy(p.g.position).setY(4.2).project(camera); if (v.z > 1) return;
    const x = (v.x + 1) / 2 * innerWidth, y = (1 - v.y) / 2 * innerHeight, b = bubbles[a.key];
    const say = a.status === "working" ? `${a.emoji} working: ${a.job.split(".")[0].toLowerCase()}` : (b && b.until > Date.now() ? b.text : "");
    html += `<div class="lab" data-k="${a.key}" style="--c:${a.colour};left:${x}px;top:${y}px"><b>${a.emoji} ${esc(a.name.toUpperCase())}</b><span>${esc(a.title)}</span>${say ? `<div class="say">${esc(say)}</div>` : ""}</div>`;
  });
  $("#labels").innerHTML = html;
  $("#labels").querySelectorAll(".lab").forEach(el => el.onclick = () => openAgent(el.dataset.k));
}

const clock = new THREE.Clock(); let lastLab = 0;
function animate() {
  const t = clock.getElapsedTime(), busy = agents.some(a => a.status === "working");
  coreMesh.rotation.y = t * .25; coreMesh.rotation.x = t * .13; wire.rotation.y = -t * .18; cloud.rotation.y = t * .05;
  const pulse = 1 + Math.sin(t * (busy ? 6 : 2)) * .06; coreMesh.scale.setScalar(pulse);
  coreMat.emissiveIntensity = (busy ? 3 : 2) + Math.sin(t * 3) * .4; coreLight.intensity = busy ? 90 : 55;
  agents.forEach(a => { const p = pods[a.key]; if (!p) return;
    const on = a.status === "working", err = a.status === "error";
    p.burst = Math.max(0, p.burst - .012);
    p.glow.material.opacity = (on ? .32 + Math.sin(t * 5) * .1 : .1) + p.burst * .5;
    p.light.intensity = on ? 30 + Math.sin(t * 6) * 8 : p.burst * 40;
    p.wall.material.emissiveIntensity = on ? .6 : .15;
    p.beam.material.opacity = on ? .7 : .14 + p.burst * .6;
    p.screens.forEach((s, k) => { s.material.opacity = on ? .7 + Math.sin(t * 9 + k) * .25 : err ? .25 : .35; s.material.color.set(err ? 0xff4d6d : p.col); });
    p.people.forEach((pp, k) => { pp.position.y = .25 + (on ? Math.abs(Math.sin(t * 7 + k)) * .08 : Math.sin(t * 1.2 + k) * .02);
      pp.rotation.y = Math.PI + (on ? 0 : Math.sin(t * .4 + k * 2) * .6); });
    p.pulses.forEach(m => { m.visible = on || p.burst > 0; if (!m.visible) return; m.userData.t = (m.userData.t + (on ? .008 : .015)) % 1; m.position.copy(p.curve.getPoint(m.userData.t)); });
    p.g.position.y = Math.sin(t * .8 + a.key.length) * .25;
  });
  controls.update(); composer.render();
  if (t - lastLab > .1) { labels(); lastLab = t; }
  requestAnimationFrame(animate);
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
renderer.domElement.addEventListener("pointerdown", () => { controls.autoRotate = false; clearTimeout(window._ar); window._ar = setTimeout(() => controls.autoRotate = true, 8000); });

/* ------------------------------------------------------------------ data */
function render(s) {
  $("#clock").textContent = s.time;
  const fresh = !agents.length;
  agents = s.agents; agents.forEach(a => { colours[a.key] = a.colour; names[a.key] = a.name; });
  if (fresh) agents.forEach((a, i) => makePod(a, i, agents.length));
  const b = s.brain; memories = b.memories || 0;
  $("#divs").innerHTML = (s.divisions || []).map(d => `<span class="chip">${esc(d.toUpperCase())}</span>`).join("") + `<span class="chip add">+ NEXT VENTURE</span>`;
  $("#orders").textContent = b.priorities || "Atlas sets the orders at 07:55.";
  $("#activeN").textContent = `${agents.filter(a => a.status === "working").length} WORKING / ${agents.length}`;
  $("#agents").innerHTML = agents.map(a => `<div class="agent" data-k="${a.key}" style="--c:${a.colour}"><div class="em">${a.emoji}</div><div><b>${esc(a.name.toUpperCase())}</b><small>${esc(a.title)} · ${esc(a.last ? a.last.result : a.job)}</small></div><span class="st ${a.status}">${a.status === "working" ? "LIVE" : a.status.toUpperCase()}</span></div>`).join("");
  $("#agents").querySelectorAll(".agent").forEach(el => el.onclick = () => openAgent(el.dataset.k));
  const pl = s.pipeline || {}, ig = b.instagram || {}, ob = s.outbox || { sent_today: 0, cap: 15 };
  $("#kpis").innerHTML = [["LEADS", pl.leads ?? b.leads_total ?? 0, "--cyan"], ["EMAILED", ob.sent_today, "--vio"], ["IG ANSWERED", ig.replied ?? 0, "--mag"], ["REPLIES", (pl.replied || 0) + (pl.interested || 0), "--green"]]
    .map(([k, n, c]) => `<div class="kpi" style="--c:var(${c})"><b>${esc(n)}</b><span>${k}</span></div>`).join("");
  const stages = [["FOUND", pl.leads || 0, "#33e1ff"], ["DRAFTED", pl.drafted || 0, "#8b5cf6"], ["CONTACTED", pl.contacted || 0, "#ff3dbb"], ["REPLIED", (pl.replied || 0) + (pl.interested || 0), "#ffcf4a"], ["WON", (pl.won || 0) + (pl.live || 0), "#3dffa2"], ["OPTED OUT", pl["opted out"] || 0, "#64748b"]];
  const max = Math.max(1, ...stages.map(x => x[1]));
  $("#pipe").innerHTML = stages.map(([k, n, c]) => `<div class="stage" style="--c:${c}"><div class="bar" style="height:${Math.max(4, n / max * 64)}px"></div><b>${n}</b><span>${k}</span></div>`).join("");
  $("#outbox").innerHTML = `<div style="display:flex;justify-content:space-between;font:700 13px Orbitron;letter-spacing:.1em"><span style="color:var(--vio)">🔍 VERA</span><span>${ob.sent_today} / ${ob.cap} SENT TODAY</span></div>`;
  $("#meter").style.width = Math.min(100, ob.sent_today / Math.max(1, ob.cap) * 100) + "%";
  $("#numbers").textContent = b.numbers || "";
  const needs = b.needs_you || [];
  $("#needN").textContent = needs.length ? `${needs.length} WAITING` : "";
  $("#needs").innerHTML = needs.map(n => `<div class="need"><b>@${esc(n.who)}</b> ${esc(n.text)}</div>`).join("");
  $("#health").innerHTML = Object.entries(b.health || {}).map(([k, v]) => `<span><i class="led ${v ? "ok" : "bad"}"></i>${k.replace(/_/g, " ").toUpperCase()}</span>`).join("");
  if (fresh) { $("#trade").value = b.settings.trade; $("#perday").value = b.settings.drafts_per_day; }
}
function addEvents(list) {
  const box = $("#stream");
  list.forEach(e => {
    if (e.kind === "start") return;
    if (ready && pods[e.agent] && (e.kind === "win" || e.kind === "done")) pods[e.agent].burst = 1;
    if (ready && e.kind !== "done") bubbles[e.agent] = { text: e.text.length > 120 ? e.text.slice(0, 118) + "…" : e.text, until: Date.now() + 9000 };
    const tm = new Date(e.ts * 1000).toTimeString().slice(0, 5);
    box.insertAdjacentHTML("afterbegin", `<div class="ev ${e.kind}" style="--c:${colours[e.agent] || "#64748b"}"><time>${tm}</time><b>${esc((names[e.agent] || e.agent).toUpperCase())}</b> ${esc(e.text)}</div>`);
  });
  while (box.children.length > 150) box.lastChild.remove();
  $("#streamN").textContent = `${box.children.length} EVENTS`;
  if (list.length) lastId = list[list.length - 1].id;
  ready = true;
}
async function openAgent(key) {
  const a = agents.find(x => x.key === key), evs = await (await fetch(`/api/events?agent=${key}&limit=25`)).json();
  const card = $("#card"); card.style.setProperty("--c", a.colour);
  card.innerHTML = `<h3>${a.emoji} ${esc(a.name.toUpperCase())} · ${esc(a.title.toUpperCase())}</h3><p>${esc(a.division)} division · ${esc(a.job)}</p>
    <div class="row"><button id="runnow">RUN NOW</button><button class="ghost" id="pause">${a.status === "paused" ? "RESUME" : "PAUSE"}</button><button class="ghost" id="close">CLOSE</button></div>
    <p>Last: ${a.last ? esc(a.last.when + " · " + a.last.result) : "not yet"} · Next: ${esc(a.next)}</p>
    <div class="stream">${evs.reverse().filter(e => e.kind !== "start").map(e => `<div class="ev ${e.kind}" style="--c:${a.colour}"><time>${new Date(e.ts * 1000).toLocaleString("en-GB").slice(0, 17)}</time> ${esc(e.text)}</div>`).join("") || "<p>No work logged yet.</p>"}</div>`;
  $("#sheet").classList.add("open");
  $("#runnow").onclick = async () => { await fetch(`/api/run/${key}`, { method: "POST" }); $("#sheet").classList.remove("open"); tick(); };
  $("#pause").onclick = async () => { await fetch(`/api/pause/${key}`, { method: "POST" }); $("#sheet").classList.remove("open"); tick(); };
  $("#close").onclick = () => $("#sheet").classList.remove("open");
}
$("#sheet").onclick = e => { if (e.target.id === "sheet") $("#sheet").classList.remove("open"); };
$("#save").onclick = async () => {
  await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trade: $("#trade").value || "barbers", drafts_per_day: +$("#perday").value || 20 }) });
  $("#save").textContent = "TRANSMITTED ✓"; setTimeout(() => $("#save").textContent = "TRANSMIT ORDERS", 1600);
};
async function tick() { try { render(await (await fetch("/api/state")).json()); } catch (e) {} }
async function feedTick() { try { addEvents(await (await fetch(`/api/events?after=${lastId}`)).json()); } catch (e) {} }
await tick(); await feedTick(); animate();
setInterval(tick, 3000); setInterval(feedTick, 2000);
</script>
</body>
