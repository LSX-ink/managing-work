<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSX HQ · Agents Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0b0b0f; --panel: rgba(22, 21, 27, .82); --edge: rgba(255, 236, 200, .12); --text: #ece7dc; --muted: #9a9384; --amber: #f6b44b; --green: #4ade80; --red: #f87171; --cyan: #67e8f9; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 13px/1.45 Inter, system-ui, sans-serif; overflow: hidden; }
#scene { position: fixed; inset: 0; }
.top { position: fixed; top: 0; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: rgba(14,13,18,.92); border-bottom: 1px solid var(--edge); z-index: 5; backdrop-filter: blur(10px); }
.brand { font: 800 14px Inter; letter-spacing: .14em; } .brand b { color: var(--amber); }
.crumb { color: var(--muted); font-size: 12px; } .crumb span { color: var(--text); }
.tabs { display: flex; gap: 6px; margin-left: 10px; }
.tab { font: 600 11px Inter; padding: 5px 10px; border: 1px solid var(--edge); border-radius: 6px; color: var(--muted); background: rgba(255,255,255,.02); }
.tab.on { color: #111; background: var(--amber); border-color: var(--amber); }
.health { margin-left: auto; display: flex; gap: 10px; font: 500 11px "JetBrains Mono"; color: var(--muted); }
.health span { display: inline-flex; gap: 5px; align-items: center; }
.led { width: 7px; height: 7px; border-radius: 50%; background: #555; } .led.ok { background: var(--green); box-shadow: 0 0 8px var(--green); } .led.bad { background: var(--red); animation: blink .8s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.live { font: 700 11px Inter; color: #111; background: var(--green); padding: 4px 8px; border-radius: 5px; letter-spacing: .08em; }
.clock { font: 700 15px "JetBrains Mono"; }
.side { position: fixed; top: 58px; bottom: 12px; width: 300px; display: flex; flex-direction: column; gap: 10px; z-index: 4; }
.side.l { left: 12px; width: 260px; } .side.r { right: 12px; width: 340px; }
.panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; backdrop-filter: blur(12px); display: flex; flex-direction: column; min-height: 0; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.panel h3 { margin: 0; padding: 11px 14px 9px; font: 700 11px Inter; letter-spacing: .14em; color: var(--muted); display: flex; justify-content: space-between; text-transform: uppercase; border-bottom: 1px solid var(--edge); }
.panel h3 b { color: var(--text); }
.pb { padding: 8px 12px 12px; overflow: auto; min-height: 0; }
.pb::-webkit-scrollbar { width: 4px; } .pb::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
.grow { flex: 1; }
.dept { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 8px; cursor: pointer; }
.dept:hover { background: rgba(255,255,255,.04); }
.dept i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); box-shadow: 0 0 10px var(--c); }
.dept b { display: block; font-weight: 700; } .dept small { color: var(--muted); font-size: 11.5px; }
.pill { font: 700 10px Inter; padding: 3px 7px; border-radius: 20px; letter-spacing: .06em; }
.pill.working { background: rgba(74,222,128,.15); color: var(--green); } .pill.idle { background: rgba(255,255,255,.06); color: var(--muted); }
.pill.error { background: rgba(248,113,113,.15); color: var(--red); } .pill.paused { background: rgba(246,180,75,.15); color: var(--amber); }
.orders { white-space: pre-wrap; font-size: 12.5px; }
.report { border: 1px solid var(--edge); border-left: 3px solid var(--c); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: rgba(255,255,255,.02); cursor: pointer; }
.report .h { display: flex; justify-content: space-between; align-items: center; }
.report b { color: var(--c); font: 700 12px Inter; letter-spacing: .06em; text-transform: uppercase; }
.report p { margin: 4px 0 0; font-size: 12.5px; color: #d8d2c6; }
.report small { color: var(--muted); font: 500 11px "JetBrains Mono"; }
.ev { font: 11.5px/1.45 "JetBrains Mono"; padding: 3px 0; color: #cfc8ba; white-space: pre-wrap; animation: in .3s ease; }
.ev time { color: var(--muted); } .ev b { color: var(--c); font-weight: 700; }
.ev.win { color: #bdf5cf; } .ev.error { color: #fecaca; } .ev.warn { color: #fde3b0; }
@keyframes in { from { opacity: 0; transform: translateY(-4px); } }
.bottom { position: fixed; left: 284px; right: 364px; bottom: 12px; display: flex; gap: 10px; z-index: 4; }
.stat { flex: 1; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(12px); }
.stat b { font: 800 22px Inter; display: block; } .stat span { color: var(--muted); font: 600 10.5px Inter; letter-spacing: .1em; text-transform: uppercase; }
.stat .bar { height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); margin-top: 7px; overflow: hidden; } .stat .bar i { display: block; height: 100%; background: var(--c); }
#cards { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.card { position: absolute; transform: translate(-50%, -100%); min-width: 150px; background: rgba(20,19,24,.9); border: 1px solid rgba(255,236,200,.16); border-radius: 10px; padding: 8px 10px; pointer-events: auto; cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.card::after { content: ""; position: absolute; left: 50%; bottom: -26px; width: 1px; height: 26px; background: linear-gradient(var(--c), transparent); }
.card .t { display: flex; justify-content: space-between; gap: 10px; align-items: center; font: 700 10.5px Inter; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.card .n { font: 800 22px Inter; color: #fff; line-height: 1.1; } .card .n small { font: 600 11px Inter; color: var(--muted); margin-left: 4px; }
.card .k { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; font-size: 11px; color: var(--muted); margin-top: 4px; } .card .k b { color: var(--text); font-weight: 600; text-align: right; }
.card .say { margin-top: 6px; font-size: 11.5px; color: #fff; border-top: 1px solid var(--edge); padding-top: 5px; max-width: 220px; }
.card.working { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 26px -4px var(--c); }
.node { position: absolute; transform: translate(-50%, -50%); font: 700 10px "JetBrains Mono"; letter-spacing: .14em; color: var(--c); text-shadow: 0 0 8px var(--c); white-space: nowrap; text-transform: uppercase; pointer-events: none; }
.node::before { content: ""; display: block; width: 14px; height: 14px; margin: 0 auto 3px; border: 2px solid var(--c); border-radius: 50%; box-shadow: 0 0 10px var(--c); }
.node.on::before { background: var(--c); animation: blink .6s infinite; }
.brainlab { position: absolute; transform: translate(-50%, 0); text-align: center; font: 700 11px "JetBrains Mono"; letter-spacing: .3em; color: #ffe3a3; text-shadow: 0 0 12px #f6b44b; pointer-events: none; }
.brainlab small { display: block; color: var(--muted); letter-spacing: .14em; font-size: 10px; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; place-items: center; z-index: 9; }
.sheet.open { display: grid; }
.modal { width: min(560px, 92vw); max-height: 84vh; overflow: auto; background: #16151b; border: 1px solid var(--c); border-radius: 14px; padding: 20px; box-shadow: 0 0 50px -10px var(--c); }
.modal h2 { margin: 0; color: var(--c); font: 800 18px Inter; } .modal p { color: var(--muted); }
.row { display: flex; gap: 8px; margin: 12px 0; }
button { font: 700 12px Inter; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--edge); background: #24222b; color: var(--text); cursor: pointer; }
button.go { background: var(--amber); color: #111; border-color: var(--amber); }
.set { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; color: var(--muted); font-size: 12px; }
.set input { width: 110px; background: #121117; color: var(--text); border: 1px solid var(--edge); border-radius: 6px; padding: 4px 6px; font: inherit; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="scene"></div>
<div id="cards"></div>
<div class="top">
  <div class="brand">LSX <b>HQ</b></div>
  <div class="crumb">AGENTS OFFICE · <span id="divname">Kinetic Web Designs</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="health" id="health"></div>
  <div class="live">● LIVE</div>
  <div class="clock" id="clock">--:--</div>
</div>
<div class="side l">
  <div class="panel"><h3>Departments <b id="deptN"></b></h3><div class="pb" id="depts"></div></div>
  <div class="panel grow"><h3>Today's orders <b>Atlas · CEO</b></h3><div class="pb orders" id="orders"></div></div>
  <div class="panel"><h3>Orders to the team</h3><div class="pb">
    <div class="set">Trade of the week <input id="trade"></div>
    <div class="set">DM drafts per day <input id="perday" type="number" min="0" max="40"></div>
    <button class="go" id="save" style="width:100%;margin-top:4px">Send orders</button>
  </div></div>
</div>
<div class="side r">
  <div class="panel grow" style="flex:1.2"><h3>Agent reports <b id="repN"></b></h3><div class="pb" id="reports"></div></div>
  <div class="panel grow"><h3>Events <b id="evN"></b></h3><div class="pb" id="events"></div></div>
</div>
<div class="bottom" id="stats"></div>
<div class="sheet" id="sheet"><div class="modal" id="modal"></div></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let agents = [], lastId = 0, colours = { hq: "#f6b44b" }, names = { hq: "HQ" }, memories = 0, ready = false;
const said = {};

/* ============================================================ the office: an isometric diorama
   Each department is a miniature office on its own raised floor: tiled carpet in its colour, glass walls,
   rows of desks with monitors, chairs, people and plants. Roads of light join every department to the central
   plaza, where the brain floats: thousands of memory particles in coloured clusters, with each agent as a node
   on its orbit. */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
$("#scene").appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0b0f);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const aspect = innerWidth / innerHeight, VIEW = 30;
const camera = new THREE.OrthographicCamera(-VIEW * aspect, VIEW * aspect, VIEW, -VIEW, 1, 500);
camera.position.set(60, 58, 60); camera.zoom = 1.05; camera.updateProjectionMatrix();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0); controls.enableDamping = true; controls.minZoom = .7; controls.maxZoom = 3.2;
controls.minPolarAngle = .65; controls.maxPolarAngle = 1.1; controls.autoRotate = true; controls.autoRotateSpeed = .25;
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .55, .5, .78));

scene.add(new THREE.HemisphereLight(0xfff1dc, 0x1a1520, .55));
const sun = new THREE.DirectionalLight(0xffe2b8, 1.6); sun.position.set(30, 60, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, far: 200 }); sun.shadow.bias = -.0005;
scene.add(sun);

// ground: dark slab with a fine grid and light roads
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x121117, roughness: .95 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -.6; ground.receiveShadow = true; scene.add(ground);
const g1 = new THREE.GridHelper(160, 80, 0x2a2733, 0x1b1922); g1.position.y = -.58; scene.add(g1);
const plaza = new THREE.Mesh(new THREE.CylinderGeometry(9, 9.6, .5, 64), new THREE.MeshStandardMaterial({ color: 0x24212b, roughness: .6, metalness: .2 }));
plaza.position.y = -.35; plaza.receiveShadow = true; scene.add(plaza);
const plazaRing = new THREE.Mesh(new THREE.TorusGeometry(9.3, .08, 8, 96), new THREE.MeshBasicMaterial({ color: 0xf6b44b })); plazaRing.rotation.x = Math.PI / 2; plazaRing.position.y = -.08; scene.add(plazaRing);

// ---- the brain: memory clusters on a sphere, plus an orbit with the agent nodes
const brain = new THREE.Group(); brain.position.y = 9; scene.add(brain);
let brainPts;
function buildBrain(cols) {
  const N = 9000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), tmp = new THREE.Color();
  const centres = cols.map((_, i) => new THREE.Vector3().setFromSphericalCoords(1, Math.acos(1 - 2 * (i + .5) / cols.length), i * 2.399));
  for (let i = 0; i < N; i++) {
    const k = i % (cols.length + 2), r = 6.2 * Math.cbrt(Math.random());
    let p = new THREE.Vector3().randomDirection().multiplyScalar(r);
    if (k < cols.length && Math.random() < .75) { p = centres[k].clone().multiplyScalar(4.4).add(new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * 2.1)); tmp.set(cols[k]); }
    else tmp.setHSL(.1 + Math.random() * .08, .5, .6 + Math.random() * .3);
    pos.set([p.x, p.y, p.z], i * 3); col.set([tmp.r, tmp.g, tmp.b], i * 3);
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3)); geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  brainPts = new THREE.Points(geo, new THREE.PointsMaterial({ size: .12, vertexColors: true, transparent: true, opacity: .95, blending: THREE.AdditiveBlending, depthWrite: false }));
  brain.add(brainPts);
  const shell = new THREE.Mesh(new THREE.SphereGeometry(6.8, 48, 32), new THREE.MeshBasicMaterial({ color: 0xf6b44b, wireframe: true, transparent: true, opacity: .05 })); brain.add(shell);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(1.6, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffd38a })); brain.add(glow);
  for (const [r, tilt, op] of [[9.5, .25, .35], [10.4, -.18, .2]]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, .03, 6, 160), new THREE.MeshBasicMaterial({ color: 0xf6b44b, transparent: true, opacity: op }));
    ring.rotation.x = Math.PI / 2 + tilt; brain.add(ring);
  }
}
const nodes = {};

// ---- departments
const depts = {};
const box = (w, h, d, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = true; m.receiveShadow = true; return m; };
const M = {
  desk: new THREE.MeshStandardMaterial({ color: 0xd9c7a8, roughness: .6 }),
  deskDark: new THREE.MeshStandardMaterial({ color: 0x3a3440, roughness: .5 }),
  chair: new THREE.MeshStandardMaterial({ color: 0x2b2830, roughness: .7 }),
  skin: [0xf1c9a5, 0xc68642, 0x8d5524, 0xe0ac69, 0xffdbac].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: .8 })),
  leaf: new THREE.MeshStandardMaterial({ color: 0x3f8f4a, roughness: .9 }), pot: new THREE.MeshStandardMaterial({ color: 0xe8e0d0, roughness: .8 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: .9, roughness: .05, thickness: .1, transparent: true, opacity: .25 }),
  frame: new THREE.MeshStandardMaterial({ color: 0x1a1820, metalness: .7, roughness: .3 }),
};
function department(a, i, n) {
  const col = new THREE.Color(a.colour), ang = i / n * Math.PI * 2 + Math.PI / 4, R = 26;
  const g = new THREE.Group(); g.position.set(Math.cos(ang) * R, 0, Math.sin(ang) * R); g.rotation.y = -ang + Math.PI / 2; scene.add(g);
  const W = 13, D = 10;
  const base = box(W + .8, .8, D + .8, new THREE.MeshStandardMaterial({ color: 0x1c1a21, metalness: .4, roughness: .4 })); base.position.y = -.2; g.add(base);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(W + .9, .06, D + .9), new THREE.MeshBasicMaterial({ color: col })); lip.position.y = .21; g.add(lip);
  // carpet tiles in the department colour
  const tileMat = new THREE.MeshStandardMaterial({ color: col.clone().lerp(new THREE.Color(0x2a2730), .62), roughness: .9 });
  const tileMat2 = new THREE.MeshStandardMaterial({ color: col.clone().lerp(new THREE.Color(0x2a2730), .7), roughness: .9 });
  for (let x = 0; x < W; x += 1) for (let z = 0; z < D; z += 1) { const t = new THREE.Mesh(new THREE.BoxGeometry(.98, .06, .98), (x + z) % 2 ? tileMat : tileMat2);
    t.position.set(x - W / 2 + .5, .26, z - D / 2 + .5); t.receiveShadow = true; g.add(t); }
  // glass walls on two sides
  for (const [w, d, x, z] of [[W, .08, 0, -D / 2], [.08, D, -W / 2, 0]]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 2.2, d), M.glass); wall.position.set(x, 1.4, z); g.add(wall);
    const top = new THREE.Mesh(new THREE.BoxGeometry(w + .05, .08, d + .05), M.frame); top.position.set(x, 2.5, z); g.add(top);
  }
  // desks in two rows of four: desk, monitor, chair, person
  const screens = [], people = [];
  for (let row = 0; row < 2; row++) for (let k = 0; k < 4; k++) {
    const x = -4.5 + k * 3, z = -2.4 + row * 4.4;
    const top = box(2.2, .1, 1.1, k % 2 ? M.desk : M.deskDark); top.position.set(x, 1.05, z); g.add(top);
    for (const lx of [-.95, .95]) { const leg = box(.08, .75, .9, M.frame); leg.position.set(x + lx, .65, z); g.add(leg); }
    const scr = new THREE.Mesh(new THREE.BoxGeometry(.95, .58, .05), new THREE.MeshStandardMaterial({ color: 0x0b0b0f, emissive: col, emissiveIntensity: .35 }));
    scr.position.set(x - .35, 1.48, z - .38); g.add(scr); screens.push(scr);
    const scr2 = scr.clone(); scr2.material = scr.material; scr2.position.x = x + .55; scr2.rotation.y = -.25; g.add(scr2);
    const kb = box(.6, .03, .2, M.chair); kb.position.set(x, 1.12, z + .1); g.add(kb);
    const chair = box(.6, .1, .6, M.chair); chair.position.set(x, .7, z + .85); g.add(chair);
    const back = box(.6, .7, .08, M.chair); back.position.set(x, 1.05, z + 1.12); g.add(back);
    const p = new THREE.Group();
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.24, .45, 4, 10), new THREE.MeshStandardMaterial({ color: col.clone().lerp(new THREE.Color(0xffffff), .25), roughness: .7 }));
    torso.position.y = 1.15; torso.castShadow = true; p.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.2, 16, 12), M.skin[(i + k + row) % M.skin.length]); head.position.y = 1.68; head.castShadow = true; p.add(head);
    p.position.set(x, 0, z + .78); g.add(p); people.push(p);
  }
  // plants in the corners and a meeting table
  for (const [x, z] of [[W / 2 - .8, D / 2 - .8], [-W / 2 + .9, D / 2 - .8], [W / 2 - .8, -D / 2 + .9]]) {
    const pot = box(.5, .45, .5, M.pot); pot.position.set(x, .5, z); g.add(pot);
    const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(.55, 0), M.leaf); leaf.position.set(x, 1.15, z); leaf.castShadow = true; g.add(leaf);
  }
  const light = new THREE.PointLight(col, 0, 18, 2); light.position.set(0, 4, 0); g.add(light);
  // a road of light from the department to the plaza
  const from = new THREE.Vector3(Math.cos(ang) * (R - 7.5), -.25, Math.sin(ang) * (R - 7.5)), to = new THREE.Vector3(Math.cos(ang) * 9.6, -.25, Math.sin(ang) * 9.6);
  const road = new THREE.Mesh(new THREE.BoxGeometry(from.distanceTo(to), .05, 1.2), new THREE.MeshStandardMaterial({ color: 0x1a1820, roughness: .6 }));
  road.position.copy(from).lerp(to, .5); road.rotation.y = -ang; road.receiveShadow = true; scene.add(road);
  const lane = new THREE.Mesh(new THREE.BoxGeometry(from.distanceTo(to), .06, .08), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: .55 }));
  lane.position.copy(road.position); lane.position.y = -.21; lane.rotation.y = -ang; scene.add(lane);
  const runners = Array.from({ length: 3 }, (_, k) => { const m = new THREE.Mesh(new THREE.SphereGeometry(.22, 10, 8), new THREE.MeshBasicMaterial({ color: col })); m.userData.t = k / 3; m.visible = false; scene.add(m); return m; });
  // the agent's node on the brain's orbit
  depts[a.key] = { g, screens, people, light, lip, col, from, to, runners, ang, burst: 0 };
  nodes[a.key] = new THREE.Vector3(Math.cos(ang) * 9.5, 9 + Math.sin(ang * 2) * 1.2, Math.sin(ang) * 9.5);
}

const v = new THREE.Vector3();
function project(p) { v.copy(p).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; }
function overlay() {
  let html = "";
  const [bx, by] = project(new THREE.Vector3(0, 19, 0));
  html += `<div class="brainlab" style="left:${bx}px;top:${by}px">SECOND BRAIN<small>${memories} MEMORIES · ${agents.length} AGENTS LINKED</small></div>`;
  agents.forEach(a => { const d = depts[a.key]; if (!d) return;
    const [nx, ny] = project(nodes[a.key]);
    html += `<div class="node ${a.status === "working" ? "on" : ""}" style="--c:${a.colour};left:${nx}px;top:${ny}px">${esc(a.name)}</div>`;
    const [cx, cy] = project(d.g.position.clone().setY(6));
    const s = said[a.key], live = a.status === "working";
    const say = live ? `Working: ${a.job.split(".")[0].toLowerCase()}…` : (s && s.until > Date.now() ? s.text : "");
    html += `<div class="card ${live ? "working" : ""}" data-k="${a.key}" style="--c:${a.colour};left:${cx}px;top:${cy}px">
      <div class="t"><span style="color:${a.colour}">${a.emoji} ${esc(a.title)}</span><span class="pill ${a.status}">${a.status === "working" ? "LIVE" : a.status.toUpperCase()}</span></div>
      <div class="n">${a.wins_today}<small>done today</small></div>
      <div class="k"><span>${esc(a.name)}</span><b>${a.runs_today} runs</b><span>Next</span><b>${esc(a.next)}</b></div>
      ${say ? `<div class="say">${esc(say)}</div>` : ""}</div>`;
  });
  $("#cards").innerHTML = html;
  $("#cards").querySelectorAll(".card").forEach(el => el.onclick = () => openAgent(el.dataset.k));
}

const clock = new THREE.Clock(); let lastO = 0;
function animate() {
  const t = clock.getElapsedTime(), busy = agents.some(a => a.status === "working");
  brain.rotation.y = t * .07; if (brainPts) brainPts.material.size = .12 + (busy ? Math.sin(t * 4) * .02 : 0);
  brain.position.y = 9 + Math.sin(t * .7) * .3;
  agents.forEach(a => { const d = depts[a.key]; if (!d) return;
    const on = a.status === "working", err = a.status === "error";
    d.burst = Math.max(0, d.burst - .01);
    d.screens.forEach((s, k) => { s.material.emissiveIntensity = on ? 1.1 + Math.sin(t * 8 + k) * .4 : (err ? .2 : .35) + d.burst; if (err) s.material.emissive.set(0xf87171); });
    d.people.forEach((p, k) => { p.position.y = on ? Math.abs(Math.sin(t * 6 + k)) * .05 : 0; p.rotation.y = on ? 0 : Math.sin(t * .5 + k * 1.7) * .4; });
    d.light.intensity = on ? 40 + Math.sin(t * 5) * 10 : d.burst * 50;
    d.lip.material.color.copy(d.col).multiplyScalar(on ? 1.6 : 1);
    d.runners.forEach(m => { m.visible = on || d.burst > 0; if (!m.visible) return; m.userData.t = (m.userData.t + .006) % 1;
      const p = d.from.clone().lerp(d.to, m.userData.t); m.position.set(p.x, -.05 + Math.sin(m.userData.t * Math.PI) * .2, p.z); });
  });
  controls.update(); composer.render();
  if (t - lastO > .08) { overlay(); lastO = t; }
  requestAnimationFrame(animate);
}
addEventListener("resize", () => { const a = innerWidth / innerHeight; Object.assign(camera, { left: -VIEW * a, right: VIEW * a }); camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
renderer.domElement.addEventListener("pointerdown", () => { controls.autoRotate = false; clearTimeout(window._ar); window._ar = setTimeout(() => controls.autoRotate = true, 10000); });

/* ============================================================ data */
function render(s) {
  $("#clock").textContent = s.time;
  const fresh = !agents.length;
  agents = s.agents; agents.forEach(a => { colours[a.key] = a.colour; names[a.key] = a.name; });
  if (fresh) { buildBrain(agents.map(a => a.colour)); agents.forEach((a, i) => department(a, i, agents.length)); }
  const b = s.brain; memories = b.memories || 0;
  $("#divname").textContent = (s.divisions || ["Kinetic Web Designs"])[0];
  $("#tabs").innerHTML = (s.divisions || []).map(d => `<span class="tab on">${esc(d)}</span>`).join("") + `<span class="tab">+ Next venture</span>`;
  $("#health").innerHTML = Object.entries(b.health || {}).map(([k, v]) => `<span><i class="led ${v ? "ok" : "bad"}"></i>${k.replace(/_/g, " ")}</span>`).join("");
  $("#deptN").textContent = `${agents.filter(a => a.status === "working").length} working · ${agents.length}`;
  $("#depts").innerHTML = agents.map(a => `<div class="dept" data-k="${a.key}" style="--c:${a.colour}"><i></i><div><b>${a.emoji} ${esc(a.name)}</b><small>${esc(a.title)}</small></div><span class="pill ${a.status}">${a.status === "working" ? "LIVE" : a.status.toUpperCase()}</span></div>`).join("");
  $("#depts").querySelectorAll(".dept").forEach(el => el.onclick = () => openAgent(el.dataset.k));
  $("#orders").textContent = b.priorities || "Atlas sets the day's orders at 07:55.";
  $("#repN").textContent = agents.length;
  $("#reports").innerHTML = agents.map(a => `<div class="report" data-k="${a.key}" style="--c:${a.colour}"><div class="h"><b>${a.emoji} ${esc(a.name)}</b><small>${a.last ? esc(a.last.when) : "—"} · next ${esc(a.next)}</small></div><p>${esc(a.last ? a.last.result : a.job)}</p></div>`).join("");
  $("#reports").querySelectorAll(".report").forEach(el => el.onclick = () => openAgent(el.dataset.k));
  const pl = s.pipeline || {}, ig = b.instagram || {}, ob = s.outbox || { sent_today: 0, cap: 15 };
  const st = [["Leads found", pl.leads || 0, "#67e8f9", 1], ["Emails sent today", `${ob.sent_today}/${ob.cap}`, "#a78bfa", ob.sent_today / Math.max(1, ob.cap)],
    ["Contacted", pl.contacted || 0, "#f472b6", Math.min(1, (pl.contacted || 0) / 50)], ["Replies", (pl.replied || 0) + (pl.interested || 0), "#f6b44b", Math.min(1, ((pl.replied || 0) + (pl.interested || 0)) / 10)],
    ["Won", (pl.won || 0) + (pl.live || 0), "#4ade80", Math.min(1, ((pl.won || 0) + (pl.live || 0)) / 5)], ["Instagram answered", ig.replied ?? 0, "#e879f9", Math.min(1, (ig.replied || 0) / 20)]];
  $("#stats").innerHTML = st.map(([k, n, c, f]) => `<div class="stat" style="--c:${c}"><b>${esc(n)}</b><span>${k}</span><div class="bar"><i style="width:${Math.max(3, f * 100)}%"></i></div></div>`).join("");
  if (fresh) { $("#trade").value = b.settings.trade; $("#perday").value = b.settings.drafts_per_day; }
}
function addEvents(list) {
  const box = $("#events");
  list.forEach(e => {
    if (e.kind === "start") return;
    if (ready && depts[e.agent] && (e.kind === "win" || e.kind === "done")) depts[e.agent].burst = 1;
    if (ready && e.kind !== "done") said[e.agent] = { text: e.text.length > 110 ? e.text.slice(0, 108) + "…" : e.text, until: Date.now() + 9000 };
    const tm = new Date(e.ts * 1000).toTimeString().slice(0, 8);
    box.insertAdjacentHTML("afterbegin", `<div class="ev ${e.kind}" style="--c:${colours[e.agent] || "#888"}"><time>${tm}</time> <b>${esc((names[e.agent] || e.agent).toUpperCase())}</b> → ${esc(e.text)}</div>`);
  });
  while (box.children.length > 150) box.lastChild.remove();
  $("#evN").textContent = box.children.length;
  if (list.length) lastId = list[list.length - 1].id;
  ready = true;
}
async function openAgent(key) {
  const a = agents.find(x => x.key === key), evs = await (await fetch(`/api/events?agent=${key}&limit=25`)).json();
  const m = $("#modal"); m.style.setProperty("--c", a.colour);
  m.innerHTML = `<h2>${a.emoji} ${esc(a.name)} · ${esc(a.title)}</h2><p>${esc(a.division)} · ${esc(a.job)}</p>
    <div class="row"><button class="go" id="runnow">Run now</button><button id="pause">${a.status === "paused" ? "Resume" : "Pause"}</button><button id="close">Close</button></div>
    <p>Last: ${a.last ? esc(a.last.when + " · " + a.last.result) : "not yet"} · Next: ${esc(a.next)}</p>
    ${evs.reverse().filter(e => e.kind !== "start").map(e => `<div class="ev ${e.kind}" style="--c:${a.colour}"><time>${new Date(e.ts * 1000).toLocaleString("en-GB").slice(0, 17)}</time> ${esc(e.text)}</div>`).join("") || "<p>No work logged yet.</p>"}`;
  $("#sheet").classList.add("open");
  $("#runnow").onclick = async () => { await fetch(`/api/run/${key}`, { method: "POST" }); $("#sheet").classList.remove("open"); tick(); };
  $("#pause").onclick = async () => { await fetch(`/api/pause/${key}`, { method: "POST" }); $("#sheet").classList.remove("open"); tick(); };
  $("#close").onclick = () => $("#sheet").classList.remove("open");
}
$("#sheet").onclick = e => { if (e.target.id === "sheet") $("#sheet").classList.remove("open"); };
$("#save").onclick = async () => {
  await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trade: $("#trade").value || "barbers", drafts_per_day: +$("#perday").value || 20 }) });
  $("#save").textContent = "Orders sent ✓"; setTimeout(() => $("#save").textContent = "Send orders", 1600);
};
async function tick() { try { render(await (await fetch("/api/state")).json()); } catch (e) { console.error(e); } }
async function feedTick() { try { addEvents(await (await fetch(`/api/events?after=${lastId}`)).json()); } catch (e) {} }
await tick(); await feedTick(); animate();
setInterval(tick, 3000); setInterval(feedTick, 2000);
</script>
</body>
</html>
