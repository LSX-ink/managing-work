<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040c">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* The glass dashboard (owner, 27 Oct 2026: "make it a glass 3d dashboard"). Frosted glass panels float over a live
   Three.js scene of glass shapes lit cyan and gold (LSX HQ's colours: cyan for live things, gold for money and wins).
   The glass is the point here, not decoration: the scene moves behind the panels and the panels let it through.
   Skills used: taste-skill (real glass: 1px inner edge, inset highlight, solid fallback for reduced transparency),
   impeccable craft-floor (one authored motion, contrast first), threejs-errors-performance and
   web3d-integration-patterns (capped pixel ratio, paused when hidden, still frame for reduced motion, CSS fallback
   without WebGL), lightweight-3d-effects (card tilt, pointer only), web-design-guidelines (labels, focus, targets). */
:root { --bg: #02040c; --glass: rgba(14,22,44,.42); --glass-hi: rgba(255,255,255,.10); --edge: rgba(160,220,255,.18);
        --cyan: #4fd1ff; --gold: #ffc24b; --green: #4be3a0; --red: #ff6b6b; --text: #eef4ff; --muted: #9aa8c6;
        --mono: "JetBrains Mono", ui-monospace, monospace; --sans: Sora, system-ui, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--text); font: 400 15px/1.5 var(--sans); min-height: 100vh; background:
       radial-gradient(900px 600px at 85% -10%, rgba(79,209,255,.18), transparent 60%),
       radial-gradient(700px 500px at 5% 105%, rgba(255,194,75,.12), transparent 60%), var(--bg); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding-block: max(18px, env(safe-area-inset-top)) 72px;
        padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* glass: blur + saturate, a 1px inner edge, a top highlight and a soft offset shadow for depth */
.glass { background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.02) 40%), var(--glass);
         -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
         border: 1px solid var(--edge); border-radius: 22px;
         box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 0 0 1px rgba(255,255,255,.03), 0 24px 60px -24px rgba(0,0,0,.75); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: rgba(12,18,36,.94); } }
@media (prefers-reduced-transparency: reduce) { .glass { background: rgba(12,18,36,.96); backdrop-filter: none; -webkit-backdrop-filter: none; } }

header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { margin: 0; font: 800 clamp(24px, 4vw, 34px)/1.05 var(--sans); letter-spacing: .01em; text-wrap: balance; }
h1 b { background: linear-gradient(90deg, #fff, var(--cyan) 55%, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.clock { margin-top: 6px; font: 700 11px var(--mono); letter-spacing: .18em; color: var(--muted); }
.clock i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 8px; vertical-align: 1px;
           box-shadow: 0 0 10px var(--green); animation: beat 2.4s ease-in-out infinite; }
@keyframes beat { 50% { opacity: .35; } }
.tabs { display: flex; gap: 4px; padding: 5px; border-radius: 999px; }
.tabs button { border: 0; background: none; color: var(--muted); font: 700 14px var(--sans); padding: 10px 18px; border-radius: 999px; cursor: pointer; min-height: 44px; }
.tabs button[aria-selected="true"] { background: linear-gradient(180deg, #7fe0ff, var(--cyan)); color: #00131d; box-shadow: 0 6px 20px -6px rgba(79,209,255,.7); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; perspective: 900px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 16px 16px 14px; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.8,.2,1); min-width: 0; }
.kpi b { display: block; font: 800 clamp(30px, 6vw, 44px)/1 var(--sans); transform: translateZ(30px); }
.kpi span { display: block; margin-top: 8px; font: 700 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); transform: translateZ(18px); }
.kpi.gold b { color: var(--gold); } .kpi.cyan b { color: var(--cyan); } .kpi.green b { color: var(--green); } .kpi.red b { color: var(--red); }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.card { grid-column: span 12; padding: 16px 18px; min-width: 0; }
.half { grid-column: span 6; }
@media (max-width: 760px) { .half { grid-column: span 12; } }
h2 { margin: 0 0 12px; font: 700 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
     display: flex; justify-content: space-between; gap: 8px; }
h2 b { color: var(--gold); }
.empty { color: var(--muted); font-size: 14px; margin: 4px 0; }
.dm { border-top: 1px solid rgba(160,220,255,.12); padding: 14px 0; display: grid; gap: 10px; }
.dm:first-of-type { border-top: 0; padding-top: 2px; }
.dm .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.dm .who { font-weight: 700; font-size: 16px; } .dm .who small { color: var(--muted); font-weight: 400; font-size: 13px; }
.dm.sent .who { color: var(--muted); text-decoration: line-through; }
.tag { font: 700 10px var(--mono); letter-spacing: .14em; padding: 4px 9px; border-radius: 999px; border: 1px solid currentColor; }
.tag.done { color: var(--green); } .tag.todo { color: var(--gold); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { appearance: none; border: 1px solid var(--edge); background: rgba(255,255,255,.06); color: var(--text); font: 600 13px var(--sans);
       padding: 10px 15px; border-radius: 12px; cursor: pointer; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center;
       box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transition: transform .15s, background .15s; }
.btn:hover { background: rgba(255,255,255,.12); } .btn:active { transform: scale(.97); }
.btn.go { background: linear-gradient(180deg, #8ae4ff, var(--cyan)); color: #00131d; border-color: transparent; }
.btn.win { background: linear-gradient(180deg, #7ff0bf, var(--green)); color: #00170d; border-color: transparent; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
details summary { color: var(--muted); font-size: 13px; cursor: pointer; }
pre { white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; font: 400 13.5px/1.55 var(--sans); background: rgba(0,0,0,.32);
      border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 12px 14px; max-height: 280px; overflow: auto; }
ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.list li { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 14px; min-width: 0; }
ul.list li span { min-width: 0; overflow-wrap: anywhere; } ul.list li em { color: var(--muted); font: 500 12px var(--mono); font-style: normal; white-space: nowrap; }
a { color: var(--cyan); }
.funnel { display: grid; gap: 12px; }
.row { display: grid; grid-template-columns: 96px 1fr 76px; gap: 10px; align-items: center; font-size: 13px; }
.bar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold)); border-radius: 99px; box-shadow: 0 0 12px rgba(79,209,255,.6);
         transform-origin: left; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes grow { from { transform: scaleX(0); } }
.row b { font: 700 13px var(--mono); text-align: right; }
.health { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.bad { background: var(--red); box-shadow: 0 0 8px var(--red); }
.now { display: grid; gap: 8px; } .now .t { font-size: clamp(18px, 3vw, 22px); font-weight: 700; text-wrap: balance; }
.pulse { color: var(--cyan); font: 700 11px var(--mono); letter-spacing: .2em; }
.pulse::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); margin-right: 8px;
                 box-shadow: 0 0 10px var(--cyan); animation: beat 1.6s ease-in-out infinite; }
/* the one authored moment: panels rise out of the glass when the page opens */
.rise { animation: rise .9s cubic-bezier(.16,1,.3,1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); filter: blur(6px); } }
@media (prefers-reduced-motion: reduce) { .rise, .bar i, .clock i, .pulse::before { animation: none; } .kpi { transition: none; } }
.toast { position: fixed; z-index: 3; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 12px 18px;
         border-radius: 14px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; color: var(--text); }
.toast.on { opacity: 1; }
[hidden] { display: none !important; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                                         "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div><h1>LSX <b>Dashboard</b></h1><div class="clock"><i></i><span id="clock">CONNECTING…</span></div></div>
    <div class="tabs glass" role="tablist" aria-label="Dashboard sections">
      <button role="tab" id="t-biz" aria-selected="true" aria-controls="biz">Business</button>
      <button role="tab" id="t-claude" aria-selected="false" aria-controls="claude">Claude</button>
    </div>
  </header>

  <main id="biz">
    <div class="kpis">
      <div class="kpi glass gold rise"><b id="k-dms">–</b><span>DMs left today</span></div>
      <div class="kpi glass red rise" style="animation-delay:.06s"><b id="k-needs">–</b><span>Need you</span></div>
      <div class="kpi glass cyan rise" style="animation-delay:.12s"><b id="k-due">–</b><span>Follow-ups due</span></div>
      <div class="kpi glass green rise" style="animation-delay:.18s"><b id="k-week">–</b><span>Sent this week</span></div>
    </div>
    <div class="grid">
      <section class="card glass rise" style="animation-delay:.2s"><h2>Instagram DMs to send today <b id="dm-count"></b></h2><div id="dms"></div></section>
      <section class="card half glass rise" style="animation-delay:.24s"><h2>Needs you <b id="needs-count"></b></h2><ul class="list" id="needs"></ul></section>
      <section class="card half glass rise" style="animation-delay:.28s"><h2>Follow-ups due <b id="due-count"></b></h2><ul class="list" id="due"></ul></section>
      <section class="card half glass rise" style="animation-delay:.32s"><h2>This week <b>target 100 · 10 · 3 · 1</b></h2><div class="funnel" id="funnel"></div></section>
      <section class="card half glass rise" style="animation-delay:.36s"><h2>Mock-ups made today <b id="mk-count"></b></h2><ul class="list" id="mockups"></ul></section>
      <section class="card glass rise" style="animation-delay:.4s"><h2>Health</h2><div class="health" id="health"></div></section>
    </div>
  </main>

  <main id="claude" class="grid" hidden>
    <section class="card glass rise"><h2>Working on now</h2><div class="now" id="now"></div></section>
    <section class="card half glass rise" style="animation-delay:.06s"><h2>Waiting for you <b id="wait-count"></b></h2><ul class="list" id="waiting"></ul></section>
    <section class="card half glass rise" style="animation-delay:.12s"><h2>Finished</h2><ul class="list" id="done"></ul></section>
  </main>
</div>
<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const link = (url, text) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);

function toast(text) { const t = $('toast'); t.textContent = text; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1900); }

function tab(which) {
  $('biz').hidden = which !== 'biz'; $('claude').hidden = which !== 'claude';
  $('t-biz').setAttribute('aria-selected', which === 'biz'); $('t-claude').setAttribute('aria-selected', which === 'claude');
  try { localStorage.setItem('dash.tab', which); } catch (e) { /* private window */ }
  window.dispatchEvent(new CustomEvent('dash:tab', { detail: which }));   // the 3D scene turns to face the other tab
}
$('t-biz').onclick = () => tab('biz'); $('t-claude').onclick = () => tab('claude');
try { if (localStorage.getItem('dash.tab') === 'claude' || location.hash === '#claude') tab('claude'); } catch (e) { /* ignore */ }

function list(el, items, row, empty) { $(el).innerHTML = items.length ? items.map(row).join('') : `<li class="empty">${esc(empty)}</li>`; }

function renderBiz(b) {
  const open = new Set([...document.querySelectorAll('#dms details[open]')].map((d) => d.dataset.name));
  const left = b.dms.filter((d) => !d.sent).length;
  const week = (b.numbers && b.numbers.this) || {};
  $('k-dms').textContent = b.dms.length ? left : '0';
  $('k-needs').textContent = b.needs_you.length; $('k-due').textContent = b.follow_ups.length;
  $('k-week').textContent = week.messages ?? '?';
  $('dm-count').textContent = b.dms.length ? `${b.dms.length - left} of ${b.dms.length} sent` : '';
  $('dms').innerHTML = b.dms.length ? b.dms.map((d, i) => `
    <div class="dm ${d.sent ? 'sent' : ''}">
      <div class="top"><span class="who">${esc(d.name)} <small>${esc(d.town)}${d.instagram ? ' · @' + esc(d.instagram) : ''}</small></span>
        <span class="tag ${d.sent ? 'done' : 'todo'}">${d.sent ? 'SENT' : 'TO SEND'}</span></div>
      <div class="btns">
        <button class="btn go" data-copy="${i}">Copy DM</button>
        ${d.instagram ? `<a class="btn" href="https://instagram.com/${encodeURIComponent(d.instagram)}" target="_blank" rel="noopener">Open @${esc(d.instagram)}</a>` : ''}
        ${d.link ? `<a class="btn" href="${esc(d.link)}" target="_blank" rel="noopener">See mock-up</a>` : ''}
        <button class="btn win" data-sent="${i}" ${d.sent ? 'disabled' : ''}>${d.sent ? 'Sent ✓' : 'I sent it'}</button>
      </div>
      <details data-name="${esc(d.name)}" ${open.has(d.name) ? 'open' : ''}><summary>Read the message</summary><pre>${esc(d.dm)}</pre></details>
    </div>`).join('') : '<p class="empty">No DM list for today yet. It arrives in the morning, on your phone too.</p>';
  document.querySelectorAll('[data-copy]').forEach((btn) => btn.onclick = () => copy(b.dms[+btn.dataset.copy].dm));
  document.querySelectorAll('[data-sent]').forEach((btn) => btn.onclick = () => sent(b.dms[+btn.dataset.sent], btn));

  $('needs-count').textContent = b.needs_you.length || '';
  list('needs', b.needs_you, (n) => `<li><span><b>@${esc(n.username)}</b>: ${esc(n.text).slice(0, 140)}</span><em>${esc(n.reason || '')}</em></li>`,
       'Nobody is waiting on you on Instagram.');
  $('due-count').textContent = b.follow_ups.length || '';
  list('due', b.follow_ups.slice(0, 12), (r) => `<li><span>${esc(r.name)}</span><em>${esc(r.channel || '')} · ${r.messages} sent</em></li>`, 'No follow-ups due today.');
  $('mk-count').textContent = b.mockups.length || '';
  list('mockups', b.mockups.slice(0, 12), (m) => `<li><span>${link(m.link, m.name)}</span><em>${esc(m.at)}</em></li>`, 'None yet today.');
  const t = b.target || {};
  const rows = [['Messages', week.messages, t.messages], ['Mock-ups', week.mockups, t.messages], ['Replies', week.replies, t.replies],
                ['Briefs', week.briefs, t.briefs], ['Payments', week.payments, t.payments]];
  $('funnel').innerHTML = rows.map(([label, n, goal]) => {
    const pct = n == null || !goal ? 0 : Math.min(100, Math.round(100 * n / goal));
    return `<div class="row"><span>${label}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${n == null ? '?' : n}${goal ? ' / ' + goal : ''}</b></div>`;
  }).join('');
  $('health').innerHTML = b.health.map((h) => `<span><span class="dot ${h.ok ? '' : 'bad'}"></span>${esc(h.name)}: ${esc(h.text)}</span>`).join('');
  window.dispatchEvent(new CustomEvent('dash:data', { detail: { left, needs: b.needs_you.length } }));
}

function renderClaude(c) {
  const n = c.now || {};
  $('now').innerHTML = n.title ? `<span class="pulse">LIVE · SINCE ${esc(n.since || '')}</span><span class="t">${esc(n.title)}</span>${n.detail ? `<span class="empty">${esc(n.detail)}</span>` : ''}`
                               : '<p class="empty">Nothing running right now. Ask in the project chat and it shows here.</p>';
  $('wait-count').textContent = (c.waiting || []).length || '';
  list('waiting', c.waiting || [], (x) => `<li><span>${link(x.link, x.title)}${x.detail ? `<br><small class="empty">${esc(x.detail)}</small>` : ''}</span><em>${esc(x.since || '')}</em></li>`, 'Nothing needs you.');
  list('done', (c.done || []).slice(0, 25), (x) => `<li><span>${link(x.link, x.title)}</span><em>${esc(x.at || '')}</em></li>`, 'Nothing yet.');
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied: paste it in Instagram'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
              try { document.execCommand('copy'); toast('Copied'); } catch (e2) { toast('Hold to copy from "Read the message"'); } ta.remove(); }
}

async function sent(d, btn) {
  btn.disabled = true;
  const r = await fetch('api/dm/sent', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: d.name }) });
  if (r.ok) { toast(`${d.name}: marked sent, follow-ups tracked`); load(); } else { btn.disabled = false; toast("Couldn't mark it: try again"); }
}

async function load() {
  try {
    const r = await fetch('api/dashboard', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    $('clock').textContent = `LIVE · ${data.time} · UPDATES EVERY 30 S`;
    renderBiz(data.business); renderClaude(data.claude);
  } catch (e) { $('clock').textContent = "CAN'T REACH HQ · RETRYING"; }
}
load(); setInterval(load, 30000);

// glass tiles tilt toward the pointer (mouse and pen only: on a phone they stay still and readable)
if (matchMedia('(hover: hover) and (pointer: fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.querySelectorAll('.kpi').forEach((el) => {
    el.addEventListener('pointermove', (e) => {
      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      el.style.transform = `rotateX(${(-y * 12).toFixed(2)}deg) rotateY(${(x * 14).toFixed(2)}deg) translateZ(6px)`;
    });
    el.addEventListener('pointerleave', () => { el.style.transform = ''; });
  });
}
</script>

<script type="module">
// The 3D scene behind the glass: floating glass shapes (real refraction through MeshPhysicalMaterial transmission),
// lit cyan and gold, drifting slowly and leaning with the pointer and the scroll. Kept light for phones: few shapes,
// pixel ratio capped, paused when the page is hidden, one still frame for reduced motion, and if WebGL or the
// download fails the CSS gradient behind it simply stays.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('scene');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'low-power' }); }
catch (e) { canvas.remove(); throw e; }
const phone = matchMedia('(max-width: 760px)').matches;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.25 : 1.6));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;
pmrem.dispose();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0, 0, 12);

const cyan = new THREE.PointLight(0x4fd1ff, 140, 34); cyan.position.set(-5, 4, 6); scene.add(cyan);
const gold = new THREE.PointLight(0xffc24b, 110, 34); gold.position.set(6, -3, 5); scene.add(gold);
const rim = new THREE.DirectionalLight(0x9fe6ff, 1.4); rim.position.set(0, 6, -8); scene.add(rim);
scene.add(new THREE.AmbientLight(0x223355, 0.6));

// coloured glass: the tint lives inside (attenuation) with a faint glow of its own, so it reads on the night background
const glass = (tint) => new THREE.MeshPhysicalMaterial({ color: tint, metalness: 0, roughness: 0.06, transmission: 0.94, thickness: 1.6,
  ior: 1.5, attenuationColor: tint, attenuationDistance: 1.4, emissive: tint, emissiveIntensity: 0.07, clearcoat: 1,
  clearcoatRoughness: 0.04, iridescence: 0.5, iridescenceIOR: 1.3, envMapIntensity: 1.6, transparent: true });
const shapes = [
  [new THREE.TorusKnotGeometry(1.1, 0.34, phone ? 96 : 160, 18), glass(0x4fd1ff), [4.2, 1.6, -2], 1.0],
  [new THREE.IcosahedronGeometry(1.25, 0), glass(0xffc24b), [-4.4, -1.8, -1], 0.8],
  [new THREE.TorusGeometry(1.2, 0.18, 24, phone ? 64 : 120), glass(0x7fe0ff), [-3.2, 2.9, -4], 1.1],
  [new THREE.OctahedronGeometry(0.85, 0), glass(0x4be3a0), [3.4, -3.1, -3], 1.2],
  [new THREE.SphereGeometry(0.75, 48, 32), glass(0xffd98a), [0.4, 3.6, -6], 0.9],
].map(([geo, mat, pos, speed], i) => {
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.userData = { base: pos.slice(), speed, phase: i * 1.7 };
  scene.add(m); return m;
});
// a soft grid of light far behind, so the glass has something to bend
const dots = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(
  Array.from({ length: (phone ? 260 : 520) * 3 }, (_, k) => (k % 3 === 2 ? -14 - Math.random() * 6 : (Math.random() - .5) * 40)), 3)),
  new THREE.PointsMaterial({ color: 0x8fd8ff, size: 0.06, transparent: true, opacity: 0.7 }));
scene.add(dots);

let px = 0, py = 0, sy = 0, turn = 0, turnTo = 0, urgent = 0;
addEventListener('pointermove', (e) => { px = e.clientX / innerWidth - .5; py = e.clientY / innerHeight - .5; }, { passive: true });
addEventListener('scroll', () => { sy = scrollY / Math.max(1, document.body.scrollHeight - innerHeight); }, { passive: true });
addEventListener('dash:tab', (e) => { turnTo = e.detail === 'claude' ? 1 : 0; if (still) frame(0); });
addEventListener('dash:data', (e) => { urgent = Math.min(1, (e.detail.needs || 0) / 3); });

function size() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.position.z = w < 760 ? 15 : 12; camera.updateProjectionMatrix();
}
addEventListener('resize', size); size();

const clock = new THREE.Clock();
function frame(t) {
  turn += (turnTo - turn) * 0.05;
  shapes.forEach((m) => {
    const { base, speed, phase } = m.userData;
    m.rotation.x = t * 0.18 * speed + phase; m.rotation.y = t * 0.24 * speed + phase;
    m.position.y = base[1] + Math.sin(t * 0.6 * speed + phase) * 0.35 - sy * 2.5;
    m.position.x = base[0] * (1 - turn * 0.25);
  });
  dots.rotation.z = t * 0.01;
  camera.position.x += (px * 1.6 - camera.position.x) * 0.04;
  camera.position.y += (-py * 1.1 - camera.position.y) * 0.04;
  camera.lookAt(0, 0, -3);
  scene.rotation.y = turn * 0.6;
  gold.intensity = 45 + urgent * 25 * (0.5 + 0.5 * Math.sin(t * 2));   // gold breathes harder when people need you
  renderer.render(scene, camera);
}
let raf = 0;
function loop() { frame(clock.getElapsedTime()); raf = requestAnimationFrame(loop); }
function start() { if (still) { frame(2); return; } if (!raf) loop(); }
function stop() { cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
start();
</script>
</body>
</html>
