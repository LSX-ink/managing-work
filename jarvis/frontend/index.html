<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S.</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/hud.css">
    <link rel="stylesheet" href="/static/custom.css">   <!-- your own colours, never overwritten by updates -->
    <style>
        /* Approval panel for mouse/keyboard actions (kept here so style.css stays yours to customise). */
        #confirm { width: 100%; padding: 14px 16px; border: 1px solid var(--think-a); border-radius: 12px; background: #121016; }
        #confirm[hidden] { display: none; }
        #confirm-title { font-weight: 600; margin-bottom: 8px; }
        #confirm-steps { margin: 0 0 12px 20px; font-size: 14px; line-height: 1.5; }
        .confirm-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        .confirm-buttons button {
            flex: 1 1 auto; padding: 10px 14px; border-radius: 8px; border: 1px solid #2a3547;
            background: #16202e; color: var(--text); font-size: 14px; cursor: pointer;
        }
        .confirm-buttons button[data-answer="allow"] { border-color: var(--accent); }
        .confirm-buttons button[data-answer="deny"] { border-color: #c0504d; }
        .confirm-buttons button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
</head>
<body>
    <header class="hud-only hud-bar">
        <span id="hud-title">J.A.R.V.I.S.</span>
        <span class="hud-sub">PERSONAL ASSISTANT // LOCAL NODE</span>
        <span class="hud-chips"><span id="hud-link">LINK · STANDBY</span><span id="hud-mic">MIC · OFF</span></span>
    </header>
    <aside class="hud-only hud-panel hud-left" aria-label="System status">
        <h2>SYSTEM</h2>
        <dl>
            <dt>STATUS</dt><dd id="hud-status">STANDBY</dd>
            <dt>MODEL</dt><dd id="hud-model">—</dd>
            <dt>VOICE</dt><dd id="hud-voice">—</dd>
            <dt>MESSAGES</dt><dd id="hud-count">0</dd>
            <dt>SESSION</dt><dd id="hud-uptime">00:00:00</dd>
            <dt>BATTERY</dt><dd id="hud-battery">—</dd>
            <dt>NETWORK</dt><dd id="hud-net">—</dd>
        </dl>
    </aside>
    <aside class="hud-only hud-panel hud-right" aria-label="Clock and audio">
        <div id="hud-clock">00:00:00</div>
        <div id="hud-date">—</div>
        <h2>SCAN</h2>
        <canvas id="hud-radar" width="220" height="220"></canvas>
        <h2>AUDIO</h2>
        <canvas id="hud-wave" width="240" height="70"></canvas>
    </aside>
    <main id="app">
        <div id="orb-wrap">
            <canvas id="hud-sphere" class="hud-only" width="420" height="420"></canvas>
            <button id="orb" class="idle" aria-label="Start or pause listening"></button>
        </div>
        <p id="status" aria-live="polite">Click the orb to wake Jarvis.</p>
        <div id="transcript" aria-live="polite"></div>
        <section id="confirm" hidden aria-live="assertive">
            <p id="confirm-title"></p>
            <ol id="confirm-steps"></ol>
            <div class="confirm-buttons">
                <button type="button" data-answer="allow" id="confirm-allow"></button>
                <button type="button" data-answer="allow_all" id="confirm-allow-all"></button>
                <button type="button" data-answer="deny" id="confirm-deny"></button>
            </div>
        </section>
        <form id="type-form" autocomplete="off">
            <input id="type-input" type="text" placeholder="…or type to Jarvis" aria-label="Message to Jarvis">
        </form>
        <section class="hud-only hud-panel hud-bottom" aria-label="Weather">
            <h2 id="hud-city">ENVIRONMENT</h2>
            <p id="hud-weather">—</p>
        </section>
    </main>
    <script src="/static/main.js"></script>
    <script src="/static/hud.js"></script>
</body>
</html>
