<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S.</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/hud.css">
    <link rel="stylesheet" href="/static/popup.css">
    <link rel="stylesheet" href="/static/popup-showme.css">
    <link rel="stylesheet" href="/static/custom.css">   <!-- your own colours, never overwritten by updates -->
    <style>
        /* Approval panel for mouse/keyboard actions (kept here so style.css stays yours to customise). */
        #confirm { width: 100%; padding: 14px 16px; border: 1px solid var(--think-a); border-radius: 12px; background: #121016; }
        #confirm[hidden] { display: none; }
        #confirm-title { font-weight: 600; margin-bottom: 8px; }
        #confirm-steps { margin: 0 0 12px 20px; font-size: 14px; line-height: 1.5; }
        .confirm-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        .confirm-buttons button {
            flex: 1 1 auto; padding: 10px 14px; border-radius: 8px; border: 1px solid #2a3547;
            background: #16202e; color: var(--text); font-size: 14px; cursor: pointer;
        }
        .confirm-buttons button[data-answer="allow"] { border-color: var(--accent); }
        .confirm-buttons button[data-answer="deny"] { border-color: #c0504d; }
        .confirm-buttons button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* The chat (transcript, approvals, typing box): in the centre column, or in a corner Alfred moves it to. */
        #chat { width: 100%; display: flex; flex-direction: column; gap: 16px; }
        @media (min-width: 1001px) {
            body[data-chat] #chat { position: fixed; z-index: 15; width: min(420px, 30vw); }
            body[data-chat] #transcript { background: var(--hud-bg, var(--bg, #000)); }  /* solid, over any panel */
            body[data-chat$="left"] #chat { left: 24px; }
            body[data-chat$="right"] #chat { right: 24px; }
            body[data-chat^="top"] #chat { top: 84px; }
            body[data-chat^="bottom"] #chat { bottom: 24px; }
        }

        /* Notifications: delivery emails and calls, newest first, scrolling slowly when there are many. */
        #alerts { width: 100%; padding: 10px 14px; border: 1px solid #1f2b3d; border-radius: 12px; background: #0c121c; }
        #alerts[hidden] { display: none; }
        #alerts h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
        #alerts-list { list-style: none; margin: 0; padding: 0; max-height: 132px; overflow-y: auto; scrollbar-width: thin; }
        #alerts-list li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid #1f2b3d; font-size: 14px; line-height: 1.4; }
        #alerts-list li:first-child { border-top: 0; }
        #alerts-list .kind { flex: none; font-size: 11px; letter-spacing: 0.08em; color: var(--accent); min-width: 44px; }
        #alerts-list .text { flex: 1; color: var(--text); overflow-wrap: anywhere; }
        #alerts-list .at { flex: none; font-size: 12px; color: var(--muted); }
        #alerts-list button { flex: none; border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 2px 6px; cursor: pointer; }
        #alerts-list button:hover, #alerts-list button:focus-visible { color: #ff7a7a; }

        /* Now playing: a card that slides in at the top when a new song starts, then slides away. */
        #np-popup { position: fixed; top: 16px; right: 16px; z-index: 20; width: min(340px, calc(100vw - 32px));
                    display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid #1f2b3d;
                    border-radius: 12px; background: #0c121c; transition: transform 0.5s ease, opacity 0.5s ease; }
        #np-popup[hidden] { display: flex; transform: translateY(-140%); opacity: 0; pointer-events: none; }
        #np-art { width: 56px; height: 56px; flex: none; object-fit: cover; border-radius: 6px; background: #1f2b3d; }
        #np-art[hidden] { display: none; }
        #np-text { min-width: 0; }
        #np-label { font-size: 11px; letter-spacing: 0.2em; color: var(--accent); }
        #np-title { color: var(--text); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #np-artist { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (prefers-reduced-motion: reduce) { #np-popup { transition: none; } }
    </style>
</head>
<body>
    <header class="hud-only hud-bar">
        <span id="hud-title">J.A.R.V.I.S.</span>
        <span class="hud-sub">PERSONAL ASSISTANT // LOCAL NODE</span>
        <span class="hud-chips"><button id="hud-memory" type="button" aria-pressed="false" title="Show the memory folders">MEMORY</button><span id="hud-link">LINK · STANDBY</span><span id="hud-mic">MIC · OFF</span></span>
    </header>
    <aside class="hud-only hud-panel hud-left" aria-label="System status">
        <h2>SYSTEM</h2>
        <dl>
            <dt>STATUS</dt><dd id="hud-status">STANDBY</dd>
            <dt>MODEL</dt><dd id="hud-model">—</dd>
            <dt>VOICE</dt><dd id="hud-voice">—</dd>
            <dt>EMAILS</dt><dd id="hud-emails">—</dd>
            <dt>SESSION</dt><dd id="hud-uptime">00:00:00</dd>
            <dt>BATTERY</dt><dd id="hud-battery">—</dd>
            <dt>NETWORK</dt><dd id="hud-net">—</dd>
        </dl>
    </aside>
    <aside class="hud-only hud-panel hud-right" aria-label="Clock and audio">
        <div id="hud-clock">00:00:00</div>
        <div id="hud-date">—</div>
        <h2>SCAN</h2>
        <canvas id="hud-radar" width="220" height="220"></canvas>
        <h2>AUDIO</h2>
        <canvas id="hud-wave" width="240" height="70"></canvas>
    </aside>
    <main id="app">
        <div id="orb-wrap">
            <canvas id="hud-sphere" class="hud-only" width="420" height="420"></canvas>
            <button id="orb" class="idle" aria-label="Start or pause listening"></button>
        </div>
        <p id="status" aria-live="polite">Click the orb to wake Jarvis.</p>
        <section id="alerts" hidden aria-label="Notifications">
            <h2 id="alerts-title">Notifications</h2>
            <ul id="alerts-list"></ul>
        </section>
        <div id="chat">
            <div id="transcript" aria-live="polite"></div>
            <section id="confirm" hidden aria-live="assertive">
                <p id="confirm-title"></p>
                <ol id="confirm-steps"></ol>
                <div class="confirm-buttons">
                    <button type="button" data-answer="allow" id="confirm-allow"></button>
                    <button type="button" data-answer="allow_all" id="confirm-allow-all"></button>
                    <button type="button" data-answer="deny" id="confirm-deny"></button>
                </div>
            </section>
            <form id="type-form" autocomplete="off">
                <input id="type-input" type="text" placeholder="…or type to Jarvis" aria-label="Message to Jarvis">
            </form>
        </div>
        <section class="hud-only hud-panel hud-bottom" aria-label="Weather">
            <h2 id="hud-city">ENVIRONMENT</h2>
            <p id="hud-weather">—</p>
        </section>
    </main>
    <aside id="memory-panel" class="hud-only hud-panel" hidden aria-label="Memory folder">
        <div class="mem-head">
            <input id="memory-name" type="text" aria-label="Folder name" maxlength="60">
            <button id="memory-rename" type="button">RENAME</button>
            <button id="memory-close" class="mem-close" type="button" aria-label="Close folder">×</button>
        </div>
        <ul id="memory-items"></ul>
        <input id="memory-title" type="text" placeholder="Note title" aria-label="Note title" maxlength="60">
        <textarea id="memory-text" placeholder="Write a note…" aria-label="Note"></textarea>
        <div class="mem-row">
            <button id="memory-save" type="button">SAVE NOTE</button>
            <label class="mem-file" for="memory-file">ADD FILE</label>
            <input id="memory-file" type="file" multiple>
        </div>
        <p id="memory-msg" class="mem-msg" aria-live="polite"></p>
    </aside>
    <aside id="np-popup" class="hud-panel" hidden aria-live="polite">
        <img id="np-art" alt="" hidden>
        <div id="np-text">
            <div id="np-label">NOW PLAYING</div>
            <div id="np-title"></div>
            <div id="np-artist"></div>
        </div>
    </aside>
    <script src="/static/main.js"></script>
    <script src="/static/neural.js"></script>
    <script src="/static/memory.js"></script>
    <script src="/static/stars.js"></script>
    <script src="/static/hud.js"></script>
    <script src="/static/popup.js"></script>
    <script src="/static/popup-showme.js"></script>
</body>
</html>
