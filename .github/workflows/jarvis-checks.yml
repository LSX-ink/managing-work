name: Jarvis checks

on:
  pull_request:
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-checks.yml"
  push:
    branches: [main]
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jarvis/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend JavaScript for syntax errors
        run: for f in frontend/*.js; do node --check "$f"; done
